[project]
name = "lift-api"
version = "0.1.0"
description = "FastAPI service for propensity modeling / brand lift"
requires-python = ">=3.10"
dependencies = [
  "propensity-lift",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.2",
  "openpyxl>=3.1",
]

[tool.uv.sources]
propensity-lift = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
