[project]
name = "propensity-lift"
version = "0.1.0"
description = "Propensity score modeling and brand lift analysis toolkit"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pyarrow>=15",
]

[project.scripts]
propensity-lift = "propensity_lift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propensity_lift"]
